[project]
name = "phishshield"
version = "1.0.0"
description = "PhishShield AI - Enterprise Threat Intelligence & Multi-Tier Phishing Protection"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "pydantic>=2.6.0",
    "python-dotenv>=1.0.0",
    "google-genai>=1.0.0",
    "rapidfuzz>=3.6.0",
    "tldextract>=5.1.0",
    "requests>=2.31.0",
    "sqlalchemy>=2.0.0"
]

[tool.vercel]
entrypoint = "backend.app.main:app"
